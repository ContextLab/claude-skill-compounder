<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="compound">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- three steps, each built on the last -->
  <rect x="52" y="150" width="40" height="50" rx="8" fill="#fff" opacity=".55"/>
  <rect x="108" y="116" width="40" height="84" rx="8" fill="#fff" opacity=".78"/>
  <rect x="164" y="76" width="40" height="124" rx="8" fill="#fff"/>
  <!-- the loop back: what was learned feeds the next start -->
  <path d="M186 50 C150 26 88 40 70 104" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <path d="M46 84 L70 110 L98 88" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
