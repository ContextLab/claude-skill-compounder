name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    # Both, on purpose. macOS runners ship bash 3.2, which is where this repo's
    # shell portability traps actually bite; ubuntu catches GNU-vs-BSD differences
    # in find, stat, and sed.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the action's default depth of 1. Two tests re-derive a
          # claim from git and a shallow clone answers them wrongly rather than not at
          # all: `test_seed_authoring.py::WhyTheseRulesTest` cites a commit that is on
          # origin/main but outside the shallow boundary, and
          # `test_seed_claim_provenance.py` derives the repository's first commit date
          # as its lower bound for an as-of date -- at depth 1 the "first" commit is
          # whatever HEAD is, so every real as-of date looks like it predates the repo.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          # 3.9 is the floor this suite supports and is deliberately the only leg: the
          # suite is shell-driven through `subprocess`, so a second Python leg re-runs
          # the same shell scripts for no new information at 9.5min (ubuntu) and
          # 20.5min (macos) apiece, measured on run 33704550609. Add 3.12 only if
          # something here starts depending on Python version behavior.
          python-version: '3.9'

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y jq
            else brew install jq; fi
          fi
          jq --version

      - name: Install pyyaml
        # Only so the frontmatter test parses with a real YAML parser instead of
        # skipping. An unquoted colon in a description silently empties a skill's
        # metadata, and that must never reach main again.
        run: python3 -m pip install --quiet pyyaml

      - name: Install zsh
        # ubuntu-latest has no zsh, so "record the version" quietly recorded nothing and
        # the zsh half of the portability claim went untested on the runner that matters.
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y zsh
            else brew install zsh; fi
          fi
          bash --version | head -1
          zsh --version

      - name: Parse and smoke every shell script under both shells
        run: |
          set -e
          for f in hooks/*.sh statusline/*.sh bin/* install.sh uninstall.sh; do
            case "$f" in *.json) continue ;; esac
            head -1 "$f" | grep -q '^#!' || continue
            bash -n "$f"
            zsh -n "$f"
          done
          echo "all scripts parse under bash and zsh"

      - name: Install history-surfer, the dependency hooks/mission.sh reads
        # A clean install wires hooks/mission.sh, which reads claude-history-surfer's
        # prompt store and keeps no copy; `skillforge doctor` therefore FAILs its `surfer`
        # row on a machine without it, and tests/test_doctor.py names that row rather
        # than skipping. Cloning the dependency here makes the runner the machine the
        # package is documented for, so the suite exercises the dependency path rather
        # than the no-dependency branch on every run. ~/claude-history-surfer is one of
        # the locations tests/test_doctor.py's real_surfer() and the installer probe.
        run: |
          git clone --depth 1 https://github.com/ContextLab/claude-history-surfer "$HOME/claude-history-surfer"
          "$HOME/claude-history-surfer/bin/surfer" --help >/dev/null
          echo "surfer: $("$HOME/claude-history-surfer/bin/surfer" --help | head -1)"

      - name: Run the suite
        run: ./run_tests.sh

  plugin-validate:
    # `claude plugin validate --strict` is what the community-marketplace review
    # pipeline runs, so a warning here is a review blocker there. It is offline and
    # needs no credentials.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The runtime the CLI runs on, not the runtime the actions run on. The Node 20
          # deprecation notice on run 33704550609 named `actions/setup-node@v4` itself,
          # which the version bump above fixes; this value is untouched.
          node-version: '20'

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin
        run: claude plugin validate . --strict

  shellcheck:
    # Both runners, because apt and brew ship different shellcheck versions and a
    # finding that exists in only one of them is still a finding. The version each one
    # resolved is printed below so a disagreement is readable in the log.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y shellcheck
            else brew install shellcheck; fi
          fi
          shellcheck --version

      - name: Lint every shell script
        # `--severity=warning` is the floor as of 2026-09-03. The job started at `error`
        # on 2026-09-02 with 19 findings at warning/note left after the three codes
        # .shellcheckrc disables (SC2016, SC2034, SC2329 -- each with its reason there);
        # those 19 were fixed or individually `# shellcheck disable=`d with a reason on
        # the line, and shellcheck 0.11.0 now prints nothing over these files at any
        # severity. `warning` rather than `style` because apt and brew ship different
        # versions and a note-level check added upstream must not turn the job red on
        # its own. Do NOT reach a floor by widening .shellcheckrc: its bar is that
        # every instance of a code is an intentional documented pattern.
        #
        # The file list mirrors the "Parse and smoke" step above rather than passing the
        # globs straight through, so a non-script dropped into bin/ makes that step fail
        # on its own terms instead of failing here as an unreadable shebang.
        #
        # The list is carried in the positional parameters, NOT in a string expanded
        # unquoted. `files="$files $f"` then `shellcheck $files` needs word splitting to
        # do anything, and zsh does not split unquoted expansions: under zsh the whole
        # list arrives as one filename and shellcheck exits 2 on a file that does not
        # exist. `set --` behaves identically in both, which is the rule this repo's
        # scripts already follow.
        run: |
          set -e
          set --
          for f in hooks/*.sh bin/* statusline/*.sh install.sh uninstall.sh; do
            case "$f" in *.json) continue ;; esac
            head -1 "$f" | grep -q '^#!' || continue
            set -- "$@" "$f"
          done
          [ "$#" -gt 0 ] || { echo "no scripts matched; the globs moved" >&2; exit 1; }
          echo "linting $# files:" "$@"
          shellcheck --severity=warning "$@"
          echo "no warning-level shellcheck findings"
