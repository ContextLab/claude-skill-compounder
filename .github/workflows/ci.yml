name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      # Claude Code's documented native installer, the current release. Neither plugin check
      # needs a login.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Claude Code version
        run: claude --version
      - name: Validate the plugin
        run: claude plugin validate --strict .
      - name: Hook tests
        run: claude plugin test .
      - name: Run the suite
        run: ./run_tests.sh
